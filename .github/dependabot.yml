version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      python-runtime:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "pytest"
          - "ruff"
          - "httpx"
      python-dev:
        applies-to: version-updates
        patterns:
          - "pytest"
          - "ruff"
          - "httpx"
    labels:
      - "dependencies"
      - "python"
    versioning-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      npm-runtime:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "*eslint*"
          - "*typescript*"
          - "*vite*"
      npm-dev:
        applies-to: version-updates
        patterns:
          - "*eslint*"
          - "*typescript*"
          - "*vite*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"