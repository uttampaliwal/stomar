[project]
name = "stomar"
version = "0.1.0"
description = "State-of-the-art stock market prediction and trading suite for Indian NSE market"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "yfinance>=0.2.44",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.0",
    "plotly>=5.25",
    "ta>=0.11",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "transformers>=4.30",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F401", "E", "F", "W"]
ignore = ["E501", "F841"]
