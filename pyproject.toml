[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stomar"
version = "0.0.10"
description = "State-of-the-art stock market prediction and trading suite for Indian NSE market"
requires-python = ">=3.12,<3.14"
dependencies = [
    "yfinance>=0.2.44,<3",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=15.0",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<4",
    "lightgbm>=4.0,<5",
    "torch>=2.0,<3",
    "ta>=0.11,<1",
    "joblib>=1.4,<2",
    "python-dotenv>=1.0,<2",
    "transformers>=4.30,<6",
    "scipy>=1.11,<2",
    "requests>=2.31,<3",
    "fastapi>=0.111.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "gunicorn>=22.0,<27",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "duckdb>=1.1,<2",
    "nsepython>=1.0.6,<3",
    "shap>=0.47,<1",
    "catboost>=1.2,<2",
    "filelock>=3.32.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# shap's TreeExplainer triggers a PendingDeprecationWarning inside the
# third-party plotting module (shap/plots/colors/_colors.py) — upstream,
# not our code; keep the suite warning-free
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.plots.colors",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
# shap pulls numba/llvmlite; the resolver occasionally backtracks to ancient
# versions that cannot build on Python 3.12+ — pin minimums explicitly.
constraint-dependencies = [
    "numba==0.66.0",
    "llvmlite==0.48.0",
]

# CPU-only torch: no GPU on the production box, and the default CUDA wheel
# drags in ~3GB of nvidia-* runtime packages. The CPU index is explicit so it
# never participates in resolution of other packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[tool.ruff.lint]
select = ["F401", "E", "F", "W"]
ignore = ["E501", "F841"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*", "services*"]
exclude = ["tests*", "tests.*"]
