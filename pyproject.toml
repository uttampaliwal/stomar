[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stomar"
version = "0.0.5"
description = "State-of-the-art stock market prediction and trading suite for Indian NSE market"
requires-python = ">=3.12,<3.14"
dependencies = [
    "yfinance>=0.2.44,<3",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=15.0",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<3",
    "lightgbm>=4.0,<5",
    "torch>=2.0,<3",
    "ta>=0.11,<1",
    "joblib>=1.4,<2",
    "python-dotenv>=1.0,<2",
    "transformers>=4.30,<5",
    "scipy>=1.11,<2",
    "requests>=2.31,<3",
    "fastapi>=0.111.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "gunicorn>=22.0,<23",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "duckdb>=1.1,<2",
    "nsepython>=1.0.6,<2",
    "shap>=0.47,<1",
    "catboost>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
# shap pulls numba/llvmlite; the resolver occasionally backtracks to ancient
# versions that cannot build on Python 3.12+ — pin minimums explicitly.
constraint-dependencies = [
    "numba==0.66.0",
    "llvmlite==0.48.0",
]

[tool.ruff.lint]
select = ["F401", "E", "F", "W"]
ignore = ["E501", "F841"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*"]
exclude = ["tests*", "tests.*"]
